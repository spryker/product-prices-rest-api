resource:
    name: AbstractProductPrices
    shortName: abstract-product-prices
    description: 'Storefront prices for abstract products'

    provider: Spryker\Glue\ProductPricesRestApi\Api\Storefront\Provider\AbstractProductPricesStorefrontProvider

    paginationEnabled: false

    security: "is_granted('CUSTOMER_ACCESS')"

    operations:
        - type: GetCollection
          name: getAbstractProductPricesByProductAbstractSku
          uriTemplate: /abstract-products/{abstractProductSku}/abstract-product-prices
          description: 'Retrieve prices of an abstract product'
          uriVariables:
              abstractProductSku:
                  fromClass: AbstractProductPricesStorefrontResource
                  identifiers:
                      - abstractProductSku
          openapiContext:
              parameters:
                  - name: 'currency'
                    in: query
                    required: false
                    description: 'ISO code of the currency to return prices in. Defaults to the default currency of the current store.'
                    schema:
                        type: string
                    example: 'EUR'
              responses:
                  200:
                      description: 'Prices of the abstract product returned.'
                  404:
                      description: 'No abstract product exists for the given SKU.'

        - type: GetCollection
          name: getAbstractProductPricesMissingSku
          uriTemplate: '/abstract-products/abstract-product-prices'
          openapi: false
          description: 'Returns 400 when abstract product SKU is missing in the path.'
          openapiContext:
              responses:
                  400:
                      description: 'Abstract product SKU is missing from the request.'

        - type: GetCollection
          name: getAbstractProductPricesBare
          uriTemplate: '/abstract-product-prices'
          openapi: false
          description: 'Returns 400 when called without the abstract product SKU prefix.'
          openapiContext:
              responses:
                  400:
                      description: 'Abstract product SKU is missing from the request.'

    properties:
        abstractProductSku:
            type: string
            identifier: true
            writable: false
            readable: true
            description: 'SKU of the parent abstract product'
            openapiContext:
                example: '001'

        price:
            type: integer
            writable: false
            readable: true
            required: false
            description: 'Default (current) price in cents'
            openapiContext:
                example: 12900

        prices:
            type: array
            writable: false
            readable: true
            required: false
            description: 'Collection of prices by type and currency'
            openapiContext:
                example:
                    - priceTypeName: 'DEFAULT'
                      netAmount: null
                      grossAmount: 12900
                      currency:
                          code: 'EUR'
                          name: 'Euro'
                          symbol: '€'
