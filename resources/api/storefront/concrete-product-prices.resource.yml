resource:
    name: ConcreteProductPrices
    shortName: concrete-product-prices
    description: 'Storefront prices for concrete products'

    provider: Spryker\Glue\ProductPricesRestApi\Api\Storefront\Provider\ConcreteProductPricesStorefrontProvider

    paginationEnabled: false

    security: "is_granted('CUSTOMER_ACCESS')"

    operations:
        - type: GetCollection
          name: getConcreteProductPricesByProductConcreteSku
          uriTemplate: /concrete-products/{concreteProductSku}/concrete-product-prices
          description: 'Retrieve prices of a concrete product'
          uriVariables:
              concreteProductSku:
                  fromClass: ConcreteProductPricesStorefrontResource
                  identifiers:
                      - concreteProductSku
          openapiContext:
              responses:
                  200:
                      description: 'Prices of the concrete product returned.'
                  404:
                      description: 'No concrete product exists for the given SKU.'

        - type: GetCollection
          name: getConcreteProductPricesMissingSku
          uriTemplate: '/concrete-products/concrete-product-prices'
          description: 'Returns 400 when concrete product SKU is missing in the path.'
          openapiContext:
              responses:
                  400:
                      description: 'Concrete product SKU is missing from the request.'

        - type: GetCollection
          name: getConcreteProductPricesBare
          uriTemplate: '/concrete-product-prices'
          description: 'Returns 400 when called without the concrete product SKU prefix.'
          openapiContext:
              responses:
                  400:
                      description: 'Concrete product SKU is missing from the request.'

    properties:
        concreteProductSku:
            type: string
            identifier: true
            writable: false
            readable: true
            description: 'SKU of the parent concrete product'
            openapiContext:
                example: '001_25904006'

        price:
            type: integer
            writable: false
            readable: true
            required: false
            description: 'Default (current) price in cents'
            openapiContext:
                example: 12900

        prices:
            type: array
            writable: false
            readable: true
            required: false
            description: 'Collection of prices by type and currency'
            openapiContext:
                example:
                    - priceTypeName: 'DEFAULT'
                      netAmount: null
                      grossAmount: 12900
                      currency:
                          code: 'EUR'
                          name: 'Euro'
                          symbol: '€'
